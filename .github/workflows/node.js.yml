# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

env:
  # Keep in sync with netlify.toml
  NODE_VERSION: 24.x

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - run: npm ci --no-audit --no-fund

  build:
    needs: install
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - name: Cache BookReader/
      uses: actions/cache@v4
      id: build-cache
      with:
        # Cache the build files so we don't have to build twice for e2e tests
        path: 'BookReader'
        key: ${{ runner.os }}-${{ github.sha }}

    - if: steps.build-cache.outputs.cache-hit != 'true'
      run: npm ci --no-audit --no-fund && npm run build

  tests:
    needs: install
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - run: npm ci --no-audit --no-fund
    - run: npm run lint
    - run: npm run test
    - uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    
  e2e-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - run: npm ci --no-audit --no-fund
    - name: Load BookReader/ from cache
      uses: actions/cache@v4
      with:
        # Cache the build files so we don't have to build twice for e2e tests
        path: 'BookReader'
        key: ${{ runner.os }}-${{ github.sha }}
    # GitHub Actions machines usually have 4 cores (see https://docs.github.com/en/actions/reference/runners/github-hosted-runners )
    # Quarantine mode (sigh) to catch unstable tests (see https://devexpress.github.io/testcafe/documentation/guides/basic-guides/run-tests.html#quarantine-mode )
    - run: npx testcafe --concurrency 4 --quarantine-mode

  # BookReader supports lit 2 and lit 3 (package.json allows both, the lockfile
  # pins 2.8.0). Run the unit tests, the build and the e2e tests against each.
  lit-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lit: ['2.8.0', '^3.3.2']
    name: lit ${{ matrix.lit }}
    env:
      LIT_DEV: ${{ matrix.lit != '2.8.0' && '1' || '' }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - run: npm ci --no-audit --no-fund
    - run: npm install --no-save --no-audit --no-fund lit@'${{ matrix.lit }}'
    - name: Check the installed lit version
      run: |
        installed=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/lit/package.json', 'utf8')).version")
        echo "lit $installed"
        case "${{ matrix.lit }}" in
          2.8.0) [ "$installed" = "2.8.0" ] ;;
          *) case "$installed" in 3.*) ;; *) exit 1 ;; esac ;;
        esac
    - run: npm run test
    - run: npm run build
    - run: npx testcafe --concurrency 4 --quarantine-mode
